aid: lemmy
name: Lemmy
description: >-
  Lemmy is a free, open-source, self-hostable federated link aggregator and discussion platform
  built as a Reddit alternative. It exposes a versioned REST API at /api/v4/ for creating posts,
  commenting, managing communities, voting, searching, and administering instances. Lemmy federates
  across the Fediverse using the ActivityPub protocol, allowing users on different Lemmy instances
  and compatible platforms (Mastodon, PeerTube, Friendica) to interact without a central server.
  Each instance operator configures their own rate limits; default limits include 50 comments per
  10 minutes, 100 searches per 10 minutes, and 5 new registrations per day. Authentication uses
  JWT bearer tokens obtained via the login endpoint. The software is licensed under AGPL-3.0 and
  written in Rust with an Actix web framework backend.
