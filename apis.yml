apis:
  - aid: lemmy:api
    name: Lemmy REST API
    description: >-
      The Lemmy REST API provides programmatic access to all core platform features including
      creating and managing posts, comments, communities, and user accounts. Developers can use the
      API to vote on content, follow communities, search across the federated network, moderate
      communities, send private messages, manage multi-communities, and administer instances.
      Authentication uses JWT bearer tokens. The API is versioned at /api/v4/ and is available on
      any public Lemmy instance, with lemmy.world being the largest instance. Rate limits are
      configurable per instance; common defaults include 50 comments per 10 minutes, 100 search
      requests per 10 minutes, and 5 registrations per day.
    humanURL: https://join-lemmy.org/docs/
    baseURL: https://lemmy.world/api/v4
